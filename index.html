<script>
var CATS={e:['Khana','Kiraya/Rent','Transport','Bill','Shopping','Salary diya','Stock/Maal','Marketing','Health','Other'],i:['Sale/Bikri','Salary','Business income','Interest','Other']};
var D={tx:[],goal:0},type='e',tab=0,mon=new Date().toISOString().slice(0,7);
var PR=[{id:'p1',n:'Main'}],PA='p1';try{var pj=JSON.parse(localStorage.getItem('hprofs')||'null');if(pj&&pj.length)PR=pj;PA=localStorage.getItem('hact')||PR[0].id;if(!PR.some(function(x){return x.id==PA}))PA=PR[0].id}catch(e){}
function dk(){return PA=='p1'?'hk':'hk_'+PA}
try{var s=localStorage.getItem(dk());if(s)D=JSON.parse(s)}catch(e){}
function save(){try{localStorage.setItem(dk(),JSON.stringify(D))}catch(e){}}
function $(i){return document.getElementById(i)}
function f(n){return '₹'+Math.round(n).toLocaleString('en-IN')}
function esc(t){return String(t||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var T=['Home','Add','Report','Excel','📷 Scan','🤖 AI','🧾 Invoice','🧾 Receipt','🧮 Calc','📒 Udhaar','🎯 Budget','📊 Charts','🔁 Recurring','📦 Stock','👥 Customers','⚙️ Backup & Lock','🔎 Search','🧾 GST Report','🎯 Goals','🏛️ Tax Estimate','💡 Insights','🎓 Doubt Solver','⏱️ Study Timer','📝 Marks Calc','📚 Homework','❓ Help','👤 Profiles','📄 Quotation','👷 Staff','💵 Cash Book','🏷️ Rate List','📈 Item Profit','🌙 Day-end WhatsApp','🏭 Supplier/Purchase','↩️ Sales Return','🏆 Top Reports','🧾 Salary Slip PDF','🏦 Loan/EMI Tracker','🎉 Wishes & Follow-ups','📷 Bill Photo Vault','🏦 Cash & Bank','📊 Smart Dashboard','🔔 Bills & Reminders','🛡️ Security & Backup','🤖 Jarvis Money AI','🎓 Student Finance'];
function tabs(){var sh=[0,1,2,4,5];if(sh.indexOf(tab)<0&&tab!=16)sh.push(tab);$('tabs').innerHTML='<button style="flex:0 0 46px" onclick="menu()">☰</button>'+sh.map(function(i){return '<button class="'+(i==tab?'on':'')+'" onclick="go('+i+')">'+T[i]+'</button>'}).join('');for(var i=0;i<T.length;i++){var pe=$('p'+i);if(pe)pe.className=i==tab?'':'hide'}}
function go(i){tab=i;if($('gs'))$('gs').value='';document.body.style.setProperty('--h',([220,150,20,45,280,190,330,160,35,25,310,200,120,60,260,100,0,170,50,230,300,210,15,140,340,90,200,30,160,45,10,130][i%32]||220));tabs();draw()}
function mt(m){return D.tx.filter(function(t){return t.d.slice(0,7)==m})}
function sum(a,k){return a.filter(function(t){return t.t==k}).reduce(function(s,t){return s+t.a},0)}
function home(){var a=mt(mon),inc=sum(a,'i'),ex=sum(a,'e'),p=inc-ex,g=D.goal,pc=g>0?Math.min(100,Math.max(0,p/g*100)):0;
var all=D.tx.slice().sort(function(x,y){return y.d.localeCompare(x.d)||y.id-x.id}).slice(0,8);
$('p0').innerHTML='<div class="card"><label>Month</label><input type="month" value="'+mon+'" onchange="mon=this.value;draw()"></div>'+
'<div class="g"><div class="card"><div class="k">Income</div><div class="v gr">'+f(inc)+'</div></div><div class="card"><div class="k">Expense</div><div class="v rd">'+f(ex)+'</div></div>'+
'<div class="card"><div class="k">'+(p>=0?'Profit / Bachat':'Loss / Nuksan')+'</div><div class="v '+(p>=0?'gr':'rd')+'">'+f(Math.abs(p))+'</div></div>'+
'<div class="card"><div class="k">Saving rate</div><div class="v">'+(inc>0?Math.round(p/inc*100):0)+'%</div></div></div>'+
'<div class="card"><div class="k">Monthly saving goal</div><div style="display:flex;gap:8px;margin-top:6px"><input type="number" id="goal" value="'+(g||'')+'" placeholder="₹ goal"><button class="btn sm" onclick="D.goal=+$(\'goal\').value||0;save();draw()">Set</button></div>'+(g>0?'<div class="bar"><i style="width:'+pc+'%"></i></div><div class="k" style="margin-top:4px">'+f(Math.max(p,0))+' / '+f(g)+' ('+Math.round(pc)+'%)</div>':'')+'</div>'+
'<div class="card"><div class="k">Recent</div>'+(all.length?all.map(row).join(''):'<p class="k">Abhi koi entry nahi. "Add" tab se shuru karo.</p>')+'</div>'}
function row(t){return '<div class="row"><div>'+esc(t.c)+(t.n?' · '+esc(t.n):'')+'<small>'+t.d+'</small></div><div><b class="'+(t.t=='i'?'gr':'rd')+'">'+(t.t=='i'?'+':'-')+f(t.a)+'</b> <button class="x" onclick="del('+t.id+')">✕</button></div></div>'}
function del(id){D.tx=D.tx.filter(function(t){return t.id!=id});save();draw()}
function add(){$('p1').innerHTML='<div class="card"><div class="seg"><button class="e '+(type=='e'?'on':'')+'" onclick="type=\'e\';add()">Expense</button><button class="i '+(type=='i'?'on':'')+'" onclick="type=\'i\';add()">Income</button></div>'+
'<label>Amount (₹)</label><input type="number" id="a" inputmode="decimal" placeholder="0"><label>Category</label><select id="c">'+CATS[type].map(function(c){return '<option value="'+c+'">'+c+'</option>'}).join('')+'</select>'+
'<label>Date</label><input type="date" id="d" value="'+new Date().toISOString().slice(0,10)+'"><label>Note (optional)</label><input id="n" placeholder="Kis liye?">'+
'<button class="btn" style="background:#0ea5e9" onclick="voice()">🎤 Bolke entry karo</button><button class="btn" onclick="ok()">Save karo</button></div>'}
function ok(){var a=+$('a').value;if(!(a>0)){toast(trs('Sahi amount daalo'));return}
D.tx.push({id:Date.now(),t:type,a:a,c:$('c').value,d:$('d').value,n:$('n').value});save();chime();var bw=bchk($('c').value,$('d').value.slice(0,7));mon=$('d').value.slice(0,7);go(0);if(bw)toast(bw)}
function report(){var a=mt(mon),ex=a.filter(function(t){return t.t=='e'}),tot=sum(a,'e'),by={};ex.forEach(function(t){by[t.c]=(by[t.c]||0)+t.a});
var ks=Object.keys(by).sort(function(x,y){return by[y]-by[x]}),inc=sum(a,'i'),p=inc-tot;
var months={};D.tx.forEach(function(t){var m=t.d.slice(0,7);months[m]=months[m]||{i:0,e:0};months[m][t.t]+=t.a});
var ms=Object.keys(months).sort().reverse();
$('p2').innerHTML='<div class="card"><label>Month</label><input type="month" value="'+mon+'" onchange="mon=this.value;draw()"><p class="'+(p>=0?'gr':'rd')+'"><b>'+(p>=0?'Profit: ':'Loss: ')+f(Math.abs(p))+'</b> (Income '+f(inc)+' − Expense '+f(tot)+')</p></div>'+
'<div class="card"><div class="k">Kharcha category-wise</div>'+(ks.length?ks.map(function(k){var pc=by[k]/tot*100;return '<div style="margin-top:10px"><div style="display:flex;justify-content:space-between"><span>'+esc(k)+'</span><span>'+f(by[k])+' ('+Math.round(pc)+'%)</span></div><div class="bar"><i style="width:'+pc+'%"></i></div></div>'}).join(''):'<p class="k">Is mahine koi kharcha nahi.</p>')+'</div>'+
'<div class="card"><div class="k">Month-wise summary</div><div class="sc"><table><tr><th>Month</th><th>Income</th><th>Expense</th><th>Profit/Loss</th></tr>'+ms.map(function(m){var x=months[m],q=x.i-x.e;return '<tr><td>'+m+'</td><td>'+f(x.i)+'</td><td>'+f(x.e)+'</td><td class="'+(q>=0?'gr':'rd')+'">'+f(q)+'</td></tr>'}).join('')+'</table></div></div>'}
function excel(){var a=D.tx.slice().sort(function(x,y){return y.d.localeCompare(x.d)}),txt='Date\tType\tCategory\tNote\tAmount\n'+a.map(function(t){return [t.d,t.t=='i'?'Income':'Expense',t.c,(t.n||'').replace(/\t/g,' '),t.a].join('\t')}).join('\n');
$('p3').innerHTML='<div class="card"><div class="k">Sab entries (Excel jaisi sheet)</div><div class="sc"><table><tr><th>Date</th><th>Type</th><th>Category</th><th>Note</th><th>Amount</th></tr>'+a.map(function(t){return '<tr><td>'+t.d+'</td><td>'+(t.t=='i'?'Income':'Expense')+'</td><td>'+esc(t.c)+'</td><td>'+esc(t.n)+'</td><td class="'+(t.t=='i'?'gr':'rd')+'">'+t.a+'</td></tr>'}).join('')+'</table></div>'+
'<button class="btn" onclick="xl()">⬇️ Excel (.xlsx) file save karo</button><button class="btn" onclick="cp()">Copy karo (Excel/Sheets mein paste karo)</button><textarea id="cv" rows="4" class="hide">'+esc(txt)+'</textarea><p class="k" id="ms"></p></div>'}
function cp(){var t=$('cv');t.className='';t.select();var m='';try{navigator.clipboard.writeText(t.value).then(function(){$('ms').textContent='Copy ho gaya! Ab Excel mein paste karo.'},function(){$('ms').textContent='Upar text select karke manually copy karo.'})}catch(e){$('ms').textContent='Upar text select karke manually copy karo.'}}
var S={items:[],busy:false,msg:''};
function prompt2(){return 'These are UPI payment app screenshots (GPay, PhonePe, Paytm, BHIM etc) or photos of shop bills and receipts. Extract every successful transaction or bill (for a bill use the total amount and shop name, as an expense). Reply ONLY with a JSON array, no other text: [{"type":"e" or "i","amount":number,"date":"YYYY-MM-DD","merchant":"name","category":"..."}]. type e = money paid/debited, i = money received/credited. Skip failed or pending ones. Expense categories: '+CATS.e.join(', ')+'. Income categories: '+CATS.i.join(', ')+'. If the year is missing use 2026.'}

function bankReconcile(){D.bankAccounts=D.bankAccounts||[];D.bankRows=D.bankRows||[];var matched=D.bankRows.filter(x=>x.matched).length;addCard(50,'<div class="card"><b>🏦 Bank Reconciliation</b><p class="k">CSV statement import, date/amount matching and manual match. No bank login or direct bank connection.</p><div class="g"><div><label>Account name</label><input id="biBankName" placeholder="SBI current account"></div><div><label>Opening balance</label><input id="biBankOpen" type="number" placeholder="0"></div></div><button class="btn" onclick="biAddBank()">Save bank account</button><label>Choose account</label><select id="biBankSelect">'+D.bankAccounts.map(x=>'<option value="'+x.id+'">'+biEsc(x.name)+'</option>').join('')+'</select><label>Import statement CSV</label><input id="biBankFile" type="file" accept=".csv,text/csv"><button class="btn" onclick="biImportBank()">Import CSV statement</button><div class="row"><span>Imported bank rows</span><b>'+D.bankRows.length+'</b></div><div class="row"><span>Matched</span><b>'+matched+'</b></div><p class="k">Expected CSV columns: Date, Description/Narration, Debit, Credit, Amount or Withdrawal/Deposit. Review all matches before relying on reconciliation.</p></div><div class="card"><b>Statement transactions</b>'+(D.bankRows.length?D.bankRows.slice().reverse().slice(0,100).map(x=>{var cand=(D.tx||[]).filter(t=>t.d===x.date&&Math.abs((+t.a||0)-Math.abs(x.amount))<.01);return '<div class="row"><div><b>'+biEsc(x.desc||'Bank transaction')+'</b><small>'+x.date+' · '+(x.amount>=0?'Credit ':'Debit ')+f(Math.abs(x.amount))+' · '+(x.matched?'MATCHED':'UNMATCHED')+(cand.length?' · '+cand.length+' candidate(s)':'')+'</small></div><div>'+(!x.matched&&cand.length?'<button class="btn sm" onclick="biMatchBank('+x.id+','+cand[0].id+')">Match</button>':'')+'<button class="x" onclick="biToggleMatch('+x.id+')">'+(x.matched?'↩️':'✓')+'</button></div></div>'}).join(''):'<p class="k">Import a CSV statement to begin.</p>')+'</div>')}

function biParseCSV(s){var rows=[],row=[],v='',q=false;for(var i=0;i<s.length;i++){var c=s[i];if(c==='"'&&q&&s[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x.trim()))rows.push(row);return rows}
function biImportBank(){var f0=$('biBankFile').files[0],aid=+$('biBankSelect').value;if(!f0){toast('CSV file choose karo');return}var r=new FileReader();r.onload=function(){try{var rows=biParseCSV(r.result),head=rows.shift().map(x=>x.trim().toLowerCase()),idx=function(keys){return head.findIndex(h=>keys.some(k=>h.includes(k)))},di=idx(['date','txn date','value date']),de=idx(['description','narration','particular','remarks']),db=idx(['debit','withdrawal','dr']),cr=idx(['credit','deposit','cr']),am=idx(['amount']);if(di<0)throw Error('Date column missing');var added=0;rows.forEach(function(z){var date=biDate(z[di]||''),desc=de>=0?z[de]:'',debit=db>=0?biNum(z[db]):0,credit=cr>=0?biNum(z[cr]):0,amount=(credit||debit)?(credit||-debit):(am>=0?biNum(z[am]):0);if(!date||!amount)return;D.bankRows.push({id:Date.now()+added,accountId:aid,date:date,desc:desc,amount:amount,matched:false});added++});save();bankReconcile();toast(added+' statement rows imported')}catch(e){toast('CSV columns read nahi hue. Date, Description, Debit/Credit ya Amount headers use karo.')}};r.readAsText(f0)}
function biDate(s){s=String(s||'').trim();if(/^\d{4}-\d\d-\d\d$/.test(s))return s;var m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(m){var y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2)}var d=new Date(s);return isNaN(d)?'':iso(d)}
